version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: weevoice-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9092:9092"  # AudioSocket
    environment:
      - DATABASE_URL=sqlite:///./data/voiceagent.db
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - FRONTEND_URL=https://${DOMAIN}
      - BACKEND_URL=https://${DOMAIN}/api
    volumes:
      - backend-data:/app/data
      - ./uploads:/app/uploads
    networks:
      - weevoice-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
    container_name: weevoice-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
    networks:
      - weevoice-network

  nginx:
    image: nginx:alpine
    container_name: weevoice-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - weevoice-network

volumes:
  backend-data:

networks:
  weevoice-network:
    driver: bridge

