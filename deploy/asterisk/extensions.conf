[general]
static = yes
writeprotect = no
autofallthrough = yes
clearglobalvars = no

[globals]
; Zadarma PJSIP endpoint (matches pjsip.conf)
TRUNK=zadarma-endpoint
AI_DID=+32480206645

;==============================================================================
; ZADARMA INCOMING CALLS
; Context matches: [zadarma-endpoint] -> context=zadarma in pjsip.conf
;==============================================================================

[zadarma]
; All incoming calls from Zadarma trunk land here
exten => _X.,1,NoOp(========================================)
 same => n,NoOp(=== Incoming Zadarma Call ===)
 same => n,NoOp(========================================)
 same => n,NoOp(Caller: ${CALLERID(num)})
 same => n,NoOp(Called: ${EXTEN})
 same => n,Set(FROM_DID=${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Set(CHANNEL(language)=en)
 same => n,NoOp(Starting WeeVoice EAGI AI Agent...)
 same => n,EAGI(/var/lib/asterisk/agi-bin/weevoice_eagi_realtime.py)
 same => n,NoOp(EAGI Status: ${AGISTATUS})
 same => n,Hangup()

; Catch-all pattern
exten => _.,1,NoOp(=== Zadarma Call (catch-all) ===)
 same => n,NoOp(Caller: ${CALLERID(num)})
 same => n,Set(FROM_DID=${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,EAGI(/var/lib/asterisk/agi-bin/weevoice_eagi_realtime.py)
 same => n,Hangup()

; Zadarma internal format (9009XXXXXXXXXX)
exten => _9009X.,1,NoOp(Zadarma internal: ${EXTEN})
 same => n,Goto(zadarma,s,1)

; Start extension
exten => s,1,NoOp(=== Zadarma Call (s) ===)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,EAGI(/var/lib/asterisk/agi-bin/weevoice_eagi_realtime.py)
 same => n,Hangup()

; Hangup handler
exten => h,1,NoOp(=== Zadarma Call Ended ===)
 same => n,NoOp(Duration: ${CDR(billsec)}s)

;==============================================================================
; WEBRTC CONTEXT
; For endpoints 55555 (AI Backend) and 44444 (WebRTC Client)
; Context matches: context=webrtc in pjsip.conf
;==============================================================================

[webrtc]
; Outbound calls from WebRTC/AI to PSTN via Zadarma
exten => _+X.,1,NoOp(WebRTC Outbound: ${EXTEN})
 same => n,Set(CALLERID(num)=${AI_DID})
 same => n,Set(CALLERID(name)=WeeVoice AI)
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},60)
 same => n,Hangup()

exten => _X.,1,NoOp(WebRTC Outbound: ${EXTEN})
 same => n,Set(CALLERID(num)=${AI_DID})
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},60)
 same => n,Hangup()

; Internal extension dialing
exten => 55555,1,Dial(PJSIP/55555,30)
exten => 44444,1,Dial(PJSIP/44444,30)

; Test AI agent from WebRTC
exten => 9999,1,NoOp(=== Test AI Agent ===)
 same => n,Answer()
 same => n,EAGI(/var/lib/asterisk/agi-bin/weevoice_eagi_realtime.py)
 same => n,Hangup()

;==============================================================================
; INTERNAL CONTEXT
; For webrtc-endpoint in pjsip.conf
;==============================================================================

[internal]
; Internal calls between extensions
exten => 55555,1,Dial(PJSIP/55555,30)
exten => 44444,1,Dial(PJSIP/44444,30)

; Outbound via Zadarma
exten => _X.,1,NoOp(Internal Outbound: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},60)
 same => n,Hangup()

;==============================================================================
; TEST EXTENSIONS (accessible from multiple contexts)
;==============================================================================

[weevoice-test]
; AI Agent test
exten => 9999,1,NoOp(=== AI Test ===)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,EAGI(/var/lib/asterisk/agi-bin/weevoice_eagi_realtime.py)
 same => n,Hangup()

; Echo test
exten => 9998,1,NoOp(=== Echo Test ===)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Playback test
exten => 9997,1,NoOp(=== Playback Test ===)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
