[general]
static = yes
writeprotect = no
autofallthrough = yes
clearglobalvars = no

[globals]
; Zadarma PJSIP endpoint (matches pjsip.conf)
TRUNK=zadarma-endpoint
WEEVOICE_EAGI=/var/lib/asterisk/agi-bin/weevoice_eagi_realtime.py

;==============================================================================
; INCLUDE DYNAMICALLY GENERATED CONFIGURATION
; These files are generated by the WeeVoice backend based on phone numbers
; in the database. Do not edit them manually - use the Phone Numbers page.
;==============================================================================

; Include dynamically generated extensions for all phone numbers
#include "extensions_weevoice.conf"

;==============================================================================
; ZADARMA INCOMING CALLS
; Context matches: [zadarma-endpoint] -> context=zadarma in pjsip.conf
;==============================================================================

[zadarma]
; All incoming calls from Zadarma trunk land here
; Route them to the weevoice-inbound context for handling

; ==============================================================================
; SECURITY: Block suspicious/fake caller IDs BEFORE answering
; This stops probe attacks with spoofed numbers like 111, 888, 9999, etc.
; ==============================================================================
exten => _X.,1,NoOp(========================================)
 same => n,NoOp(=== Incoming Zadarma Call ===)
 same => n,NoOp(========================================)
 same => n,NoOp(Caller: ${CALLERID(num)})
 same => n,NoOp(Called: ${EXTEN})
 same => n,Set(CALLER_NUM=${CALLERID(num)})
 same => n,Set(CALLER_LEN=${LEN(${CALLER_NUM})})
 ; Block if caller ID is too short (less than 6 digits) - likely spoofed
 same => n,GotoIf($[${CALLER_LEN} < 6]?check_emergency)
 same => n,Goto(allowed)
 ; Check if it's an emergency number (allow these)
 same => n(check_emergency),GotoIf($["${CALLER_NUM}" = "911"]?allowed)
 same => n,GotoIf($["${CALLER_NUM}" = "112"]?allowed)
 same => n,GotoIf($["${CALLER_NUM}" = "999"]?allowed)
 same => n,GotoIf($["${CALLER_NUM}" = "15"]?allowed)
 same => n,GotoIf($["${CALLER_NUM}" = "17"]?allowed)
 same => n,GotoIf($["${CALLER_NUM}" = "18"]?allowed)
 ; Not emergency and too short - BLOCK IT
 same => n,NoOp(>>> BLOCKED: Suspicious short caller ID: ${CALLER_NUM} <<<)
 same => n,Congestion()
 same => n,Hangup()
 ; Caller ID passed checks - allow the call
 same => n(allowed),NoOp(Caller ID OK: ${CALLER_NUM})
 same => n,Set(FROM_DID=${EXTEN})
 same => n,Set(CALLED_DID=${EXTEN})
 same => n,Goto(weevoice-inbound,${EXTEN},1)

; Catch-all pattern - route to weevoice (with security check)
exten => _.,1,NoOp(=== Zadarma Call (catch-all) ===)
 same => n,NoOp(Caller: ${CALLERID(num)})
 same => n,Gosub(check-caller-id,s,1)
 same => n,Set(FROM_DID=${EXTEN})
 same => n,Set(CALLED_DID=${EXTEN})
 same => n,Goto(weevoice-inbound,${EXTEN},1)

; With + prefix (with security check)
exten => _+X.,1,NoOp(=== Zadarma Call (+): ${EXTEN} ===)
 same => n,Gosub(check-caller-id,s,1)
 same => n,Set(FROM_DID=${EXTEN})
 same => n,Set(CALLED_DID=${EXTEN})
 same => n,Goto(weevoice-inbound,${EXTEN:1},1)

; Zadarma internal format (9009XXXXXXXXXX) (with security check)
exten => _9009X.,1,NoOp(Zadarma internal: ${EXTEN})
 same => n,Gosub(check-caller-id,s,1)
 same => n,Set(FROM_DID=${EXTEN})
 same => n,Goto(weevoice-inbound,${EXTEN},1)

; Start extension (with security check)
exten => s,1,NoOp(=== Zadarma Call (s) ===)
 same => n,Gosub(check-caller-id,s,1)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,EAGI(${WEEVOICE_EAGI})
 same => n,Hangup()

; Hangup handler
exten => h,1,NoOp(=== Zadarma Call Ended ===)
 same => n,NoOp(Duration: ${CDR(billsec)}s)

;==============================================================================
; WEBRTC CONTEXT
; For endpoints 55555 (AI Backend) and 44444 (WebRTC Client)
; Context matches: context=webrtc in pjsip.conf
;==============================================================================

[webrtc]
; Outbound calls from WebRTC/AI to PSTN via Zadarma
exten => _+X.,1,NoOp(WebRTC Outbound: ${EXTEN})
 same => n,Set(CALLERID(num)=${CALLERID(num)})
 same => n,Set(CALLERID(name)=WeeVoice AI)
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},60)
 same => n,Hangup()

exten => _X.,1,NoOp(WebRTC Outbound: ${EXTEN})
 same => n,Set(CALLERID(num)=${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},60)
 same => n,Hangup()

; Internal extension dialing
exten => 55555,1,Dial(PJSIP/55555,30)
exten => 44444,1,Dial(PJSIP/44444,30)

; Test AI agent from WebRTC
exten => 9999,1,NoOp(=== Test AI Agent ===)
 same => n,Answer()
 same => n,EAGI(${WEEVOICE_EAGI})
 same => n,Hangup()

;==============================================================================
; INTERNAL CONTEXT
; For webrtc-endpoint in pjsip.conf
;==============================================================================

[internal]
; Internal calls between extensions
exten => 55555,1,Dial(PJSIP/55555,30)
exten => 44444,1,Dial(PJSIP/44444,30)

; Outbound via Zadarma
exten => _X.,1,NoOp(Internal Outbound: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},60)
 same => n,Hangup()

;==============================================================================
; FALLBACK WEEVOICE-INBOUND
; This is a fallback if extensions_weevoice.conf is not available
; Once the configuration is generated, this will be overridden
;==============================================================================

[weevoice-inbound]
; Fallback handler - all calls go to EAGI script which routes to correct agent
exten => _X.,1,NoOp(=== WeeVoice Inbound (Fallback): ${EXTEN} ===)
 same => n,Set(FROM_DID=${EXTEN})
 same => n,Set(CALLED_DID=${EXTEN})
 same => n,NoOp(Caller: ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,EAGI(${WEEVOICE_EAGI})
 same => n,NoOp(EAGI Status: ${AGISTATUS})
 same => n,Hangup()

exten => _+X.,1,Goto(${EXTEN:1},1)

exten => s,1,NoOp(=== WeeVoice Inbound (s) ===)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,EAGI(${WEEVOICE_EAGI})
 same => n,Hangup()

exten => h,1,NoOp(=== WeeVoice Call Ended ===)
 same => n,NoOp(Duration: ${CDR(billsec)}s)

;==============================================================================
; SECURITY: Caller ID Validation Subroutine
; Blocks suspicious/fake caller IDs (111, 888, 9999, etc.)
; Called via Gosub(check-caller-id,s,1)
;==============================================================================

[check-caller-id]
exten => s,1,NoOp(--- Checking Caller ID: ${CALLERID(num)} ---)
 same => n,Set(CALLER_NUM=${CALLERID(num)})
 same => n,Set(CALLER_LEN=${LEN(${CALLER_NUM})})
 ; If caller ID is 10+ digits, it's likely legitimate - allow
 same => n,GotoIf($[${CALLER_LEN} >= 10]?ok)
 ; If caller ID is less than 6 digits, check if it's emergency
 same => n,GotoIf($[${CALLER_LEN} < 6]?check_short)
 ; 6-9 digits - check for suspicious patterns
 same => n,Goto(check_pattern)

 ; Check very short numbers
 same => n(check_short),GotoIf($["${CALLER_NUM}" = "911"]?ok)
 same => n,GotoIf($["${CALLER_NUM}" = "112"]?ok)
 same => n,GotoIf($["${CALLER_NUM}" = "999"]?ok)
 same => n,GotoIf($["${CALLER_NUM}" = "15"]?ok)
 same => n,GotoIf($["${CALLER_NUM}" = "17"]?ok)
 same => n,GotoIf($["${CALLER_NUM}" = "18"]?ok)
 ; Short number that's not emergency - block it
 same => n,Goto(blocked)

 ; Check for suspicious patterns (repeated digits, etc.)
 same => n(check_pattern),NoOp(Checking pattern for ${CALLER_NUM})
 ; Block common fake patterns: all same digits
 same => n,GotoIf($["${CALLER_NUM}" = "111"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "222"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "333"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "444"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "555"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "666"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "777"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "888"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "999"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "000"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "1111"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "2222"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "3333"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "4444"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "5555"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "6666"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "7777"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "8888"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "9999"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "0000"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "11111"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "22222"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "33333"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "44444"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "55555"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "66666"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "77777"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "88888"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "99999"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "00000"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "111111"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "222222"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "333333"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "444444"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "555555"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "666666"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "777777"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "888888"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "999999"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "000000"]?blocked)
 ; Sequential patterns
 same => n,GotoIf($["${CALLER_NUM}" = "1234"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "12345"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "123456"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "4321"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "54321"]?blocked)
 same => n,GotoIf($["${CALLER_NUM}" = "654321"]?blocked)
 ; Passed all checks
 same => n,Goto(ok)

 ; BLOCKED - hang up immediately
 same => n(blocked),NoOp(>>> SECURITY: BLOCKED suspicious caller ID: ${CALLER_NUM} <<<)
 same => n,Congestion()
 same => n,Hangup()

 ; OK - return to caller
 same => n(ok),NoOp(Caller ID OK: ${CALLER_NUM})
 same => n,Return()

;==============================================================================
; TEST EXTENSIONS (accessible from multiple contexts)
;==============================================================================

[weevoice-test]
; AI Agent test
exten => 9999,1,NoOp(=== AI Test ===)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,EAGI(${WEEVOICE_EAGI})
 same => n,Hangup()

; Echo test
exten => 9998,1,NoOp(=== Echo Test ===)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Playback test
exten => 9997,1,NoOp(=== Playback Test ===)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
