;==============================================================================
; WeeVoice PJSIP Configuration
; Main configuration file for Asterisk PJSIP
;==============================================================================

[global]
type=global
max_initial_qualify_time=0
keep_alive_interval=30

;==============================================================================
; TRANSPORTS
;==============================================================================

; UDP Transport for Zadarma SIP trunk
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; WebSocket Transport for WebRTC clients
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

;==============================================================================
; ZADARMA SIP TRUNK
; Main trunk for incoming/outgoing PSTN calls
;
; The auth and registration sections are included from a separate file.
; This file is auto-generated by WeeVoice when you save SIP settings
; in the Phone Numbers page.
;
; Manual setup: Edit /etc/asterisk/pjsip_zadarma_credentials.conf
;==============================================================================

; Include Zadarma credentials (auth + registration)
; This file MUST exist - created by deploy script or backend
#include "pjsip_zadarma_credentials.conf"

[zadarma-endpoint]
type=endpoint
transport=transport-udp
context=zadarma
disallow=all
allow=ulaw
allow=alaw
allow=opus
allow=g729
from_domain=sip.zadarma.com
; NOTE: No 'auth=' for incoming - incoming calls are identified by IP only
; outbound_auth is used for outgoing calls (registration and dialing out)
outbound_auth=zadarma-auth
aors=zadarma-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
identify_by=ip

[zadarma-aor]
type=aor
contact=sip:sip.zadarma.com
qualify_frequency=30
qualify_timeout=3.0

[zadarma-identify]
type=identify
endpoint=zadarma-endpoint
match=sip.zadarma.com
; Zadarma IP ranges - add more if calls come from other IPs
match=185.45.152.0/24
match=185.45.153.0/24
match=185.45.154.0/24
match=185.45.155.0/24
match=185.243.5.0/24

;==============================================================================
; INTERNAL EXTENSIONS
; Used for testing and internal calls
;==============================================================================

; AI Backend Extension (55555)
[55555]
type=endpoint
transport=transport-wss
context=internal
disallow=all
allow=ulaw
allow=alaw
allow=opus
webrtc=yes
dtls_auto_generate_cert=yes
media_encryption=dtls
auth=55555-auth
aors=55555
callerid="WeeVoice AI" <55555>
direct_media=no
rtp_symmetric=yes
ice_support=yes

[55555-auth]
type=auth
auth_type=userpass
username=55555
password=KpowernBgdfgdffdgg3244126

[55555]
type=aor
max_contacts=5
remove_existing=yes

; WebRTC Client Extension (44444)
[44444]
type=endpoint
transport=transport-wss
context=internal
disallow=all
allow=ulaw
allow=alaw
allow=opus
webrtc=yes
dtls_auto_generate_cert=yes
media_encryption=dtls
auth=44444-auth
aors=44444
callerid="WebRTC Client" <44444>
direct_media=no
rtp_symmetric=yes
ice_support=yes

[44444-auth]
type=auth
auth_type=userpass
username=44444
password=WebRTCclient2024!126

[44444]
type=aor
max_contacts=5
remove_existing=yes

;==============================================================================
; INCLUDE DYNAMICALLY GENERATED CONFIGURATION
; Phone number-specific endpoints are generated by the WeeVoice backend
; based on the SIP configuration stored in the database.
; 
; To regenerate this file:
; 1. Update SIP settings in Phone Numbers page
; 2. Call POST /api/v1/asterisk/regenerate
; Or update any phone number SIP config - it auto-regenerates
;==============================================================================

#include "pjsip_weevoice.conf"

