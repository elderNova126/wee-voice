<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px;">
        <h2 style="color: #333; margin-top: 0;">Verify Your Email</h2>
        <p>Hi {{full_name}},</p>
        <p>Click the link below to verify your email:</p>
        <p style="text-align: center; margin: 30px 0;">
            <a href="{{verification_url}}" style="display: inline-block; padding: 12px 24px; background-color: #667eea; color: white; text-decoration: none; border-radius: 4px;">Verify Email</a>
        </p>
        <p style="font-size: 12px; color: #666;">Link: {{verification_url}}</p>
        <p style="font-size: 12px; color: #999;">This link expires in 24 hours.</p>
    </div>
</body>
</html>
